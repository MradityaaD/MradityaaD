name: Update Stats

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate stats SVG
        run: python generate_stats.py
        env:
          GH_USER: MradityaaD
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUT_DIR: .

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stats.svg languages.svg streak.svg activity.svg
          git diff --cached --quiet || (git commit -m "chore: update stats" && git push)
