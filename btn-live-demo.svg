<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 46" width="210" height="46" role="img" aria-label="Live Demo">
<title>Live Demo</title>
<defs><filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><clipPath id="bc"><rect x="2" y="2" width="206" height="42" rx="8"/></clipPath><linearGradient id="shine" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".25"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>
<rect x="2" y="2" width="206" height="42" rx="8" fill="#0d0d0d" stroke="#39ff6e" stroke-width="1.6"><animate attributeName="stroke-opacity" values="1;.5;1" dur="2.6s" repeatCount="indefinite"/></rect><polygon points="24,14 24,32 39,23" fill="#39ff6e" filter="url(#glow)"/><text x="54" y="28" font-family="'JetBrains Mono','Fira Code',Consolas,'SF Mono','Courier New',monospace" font-size="13.5" font-weight="700" letter-spacing="1.8" fill="#f5f5f5">LIVE DEMO</text><g clip-path="url(#bc)"><g><rect x="-40" y="2" width="30" height="42" fill="url(#shine)" transform="skewX(-20)"/><animateTransform attributeName="transform" type="translate" values="0 0;260 0;260 0" keyTimes="0;.4;1" dur="5s" repeatCount="indefinite"/></g></g>
